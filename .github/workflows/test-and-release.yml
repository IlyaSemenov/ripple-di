name: Test and Release

env:
  # Keep in sync with .changeset/config.json:baseBranch
  MAIN_REF: refs/heads/main

on:
  push:
    branches: [main]
  pull_request:

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Publish to npm with OIDC
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # Every runtime that docs/getting-started.md claims support for runs the built package.
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.11.9

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build package
        run: bun run build

      - name: Smoke test on Bun
        run: bun tests/smoke.mjs

      - name: Setup oldest supported Node
        uses: actions/setup-node@v7
        with:
          node-version: 18.18.0

      - name: Smoke test on Node 18.18.0
        run: node tests/smoke.mjs

      - name: Setup current Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Smoke test on Node 24
        run: node tests/smoke.mjs

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Smoke test on Deno
        run: deno run --allow-env --allow-read --allow-write tests/smoke.mjs

  test-and-release:
    name: Test and Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.11.9

      # for npx publish
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Lint package
        run: bun run lint:check

      - name: Build package
        run: bun run build

      - name: Typecheck package
        run: bun run types

      - name: Test package
        run: bun run test

      - name: Build docs
        run: bun run docs:build

      - name: Capture release title
        if: ${{ github.ref == env.MAIN_REF }}
        run: |
          npx @changesets/cli status --output=release.json
          echo "RELEASE=Release $(jq -r '.releases | sort_by(.name) | map(.name + "@" + .newVersion) | join(", ")' release.json)" >> "$GITHUB_ENV"
          rm release.json

      - name: Create Release Pull Request or Publish to npm
        if: ${{ github.ref == env.MAIN_REF }}
        uses: changesets/action@v2.1.2
        with:
          publish-script: npx changeset publish
          pr-title: ${{ env.RELEASE }}
          commit-message: ${{ env.RELEASE }}
